services:
  postgres:
    image: postgres:16
    container_name: edu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edu_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d edu_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: edu_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.dockerfile
    container_name: edu_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/edu_platform
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecret
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev:api"

  worker:
    build:
      context: .
      dockerfile: docker/worker.dockerfile
    container_name: edu_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/edu_platform
      REDIS_URL: redis://redis:6379
      EVENT_BUS_BACKEND: redis
      # The worker validates its env at startup (CF-R2) and is the only process
      # that sends mail. These are dummy local values on purpose — the Resend
      # key is never real in this file, and the demo flag stays off, so nothing
      # can send. A real key belongs in the Railway service variables only.
      RESEND_API_KEY: re_local_dummy_key
      EMAIL_FROM_ADDRESS: no-reply@edunic.local
      EMAIL_REPLY_TO: support@edunic.local
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev:worker"

volumes:
  postgres_data:
  api_node_modules:
  worker_node_modules:
